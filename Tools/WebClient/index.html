<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Web Client</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: none; outline: none; }
  #status { position: fixed; left: 16px; bottom: 12px; color: #c8b27a; font: 13px system-ui, sans-serif; }
  #closed { display: grid; place-content: center; gap: 16px; height: 100%; padding: 0 16px; text-align: center; color: #e8dcc0; font: 16px system-ui, sans-serif; }
  #closed button { justify-self: center; padding: 10px 22px; border: 0; border-radius: 6px; background: #8a1c12; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="status">Loading…</div>
<script>
  // The client connects to 127.0.0.1:3724 and to the realm's address; every WebSocket goes to serve.py instead,
  // which forwards it to that port (/ws/<host>/<port>).
  const NativeWebSocket = window.WebSocket;
  function ProxiedWebSocket(url, protocols) {
    const m = /^wss?:\/\/([^/:]+):(\d+)/.exec(url);
    if (m) url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + m[1] + '/' + m[2];
    return new NativeWebSocket(url, protocols);
  }
  ProxiedWebSocket.prototype = NativeWebSocket.prototype;
  for (const k of ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED']) ProxiedWebSocket[k] = NativeWebSocket[k];
  window.WebSocket = ProxiedWebSocket;

  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const view = canvas.getContext('bitmaprenderer', { alpha: false });
  // The game renders at the display's resolution: one canvas pixel per screen pixel (Windows display scaling, browser
  // zoom). Os/Web/Input.cpp maps mouse positions by the canvas's own ratio. ?lowres renders at CSS pixels instead (at
  // 150% scaling less than half the pixels), for slower GPUs.
  const lowres = new URLSearchParams(location.search).has('lowres');
  function fit() {
    const ratio = lowres ? 1 : devicePixelRatio;
    canvas.width = Math.round(canvas.clientWidth * ratio);
    canvas.height = Math.round(canvas.clientHeight * ratio);
  }
  fit();
  // CSS size times devicePixelRatio, rounded, is often a pixel off the screen pixels the canvas really covers, and then
  // the browser resamples every frame by a hair, smearing one-pixel strokes of text. The observer reports the exact
  // count where the browser knows it (Chrome, Firefox).
  new ResizeObserver(([entry]) => {
    const box = !lowres && entry.devicePixelContentBoxSize && entry.devicePixelContentBoxSize[0];
    if (!box) return fit();
    canvas.width = box.inlineSize;
    canvas.height = box.blockSize;
  }).observe(canvas);

  var Module = {
    canvas,
    // Frames from the render worker (Engine/Source/Gx/CGxDeviceWebGl/WebGl.js).
    wowPresent(frame) { view.transferFromImageBitmap(frame); status.hidden = true; },
    print: (text) => console.log(text),
    printErr: (text) => console.error(text),
    // WTF (settings, keybinds, macros, addon SavedVariables) lives in this browser's IndexedDB, loaded before main()
    // and saved every few seconds and when the page is hidden. The client rewrites whole files, so only what changed
    // since the last save can be lost.
    preRun: [(module) => {
      const { FS, IDBFS, addRunDependency, removeRunDependency } = module;
      FS.mkdir('/wow');
      FS.mkdir('/wow/WTF');
      FS.mount(IDBFS, {}, '/wow/WTF');
      addRunDependency('wtf');
      FS.syncfs(true, (err) => { if (err) console.error('Loading saved settings failed:', err); removeRunDependency('wtf'); });
      let saving = null;
      const save = () => saving || (saving = new Promise((resolve) => FS.syncfs(false, (err) => {
        saving = null;
        if (err) console.error('Saving settings failed:', err);
        resolve();
      })));
      const timer = setInterval(save, 5000);
      document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

      // Quit (login screen) and Exit Game end the client (Web/WebMain.cpp). The settings it wrote on the way out are
      // saved, then the tab closes. Browsers only let a page close a tab that a script opened or that has a single
      // history entry, so otherwise the page says so instead.
      module.wowQuit = async () => {
        clearInterval(timer);
        await saving;
        await save();
        window.close();
        document.body.innerHTML = '<main id="closed"><p>You have left the game. You can close this tab.</p>'
          + '<button onclick="location.reload()">Play again</button></main>';
      };
    }],
  };
  if (!crossOriginIsolated) status.textContent = 'Needs cross-origin isolation: open this page through Tools/WebClient/serve.py.';
</script>
<script src="WowWeb.js"></script>
</body>
</html>
