<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0d12; color: #e8dcc0; font: 15px system-ui, sans-serif; }
  main { max-width: 340px; margin: 12vh auto 0; padding: 0 16px; }
  h1 { font-size: 22px; font-weight: 600; color: #f0c860; margin: 0 0 20px; }
  label { display: block; margin: 14px 0 6px; font-size: 13px; color: #c8b27a; }
  input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #4a4030; border-radius: 6px; background: #151820; color: #fff; font: inherit; }
  input:focus { outline: 2px solid #f0c860; outline-offset: 1px; }
  button { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #8a1c12; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  p { min-height: 1.4em; font-size: 14px; }
  .error { color: #ff8a7a; }
  .done { color: #9be38f; }
  small { color: #8a8070; }
</style>
</head>
<body>
<main>
  <h1>Create an account</h1>
  <form id="form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required pattern="[A-Za-z0-9]{3,16}" maxlength="16"
           title="3 to 16 letters and digits">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="4" maxlength="16">
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password" required maxlength="16">
    <button id="submit">Create account</button>
    <p id="result" role="status"></p>
    <small>Letters and digits for the username, at most 16 characters each. Then go back to the game tab and log in.</small>
  </form>
</main>
<script>
  const form = document.getElementById('form'), result = document.getElementById('result'), submit = document.getElementById('submit');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (form.password.value !== document.getElementById('confirm').value) {
      result.className = 'error';
      result.textContent = 'The passwords do not match.';
      return;
    }
    submit.disabled = true;
    try {
      const response = await fetch('register', { method: 'POST', body: new URLSearchParams(new FormData(form)) });
      result.className = response.ok ? 'done' : 'error';
      result.textContent = await response.text();
      if (response.ok) form.reset();
    } catch {
      result.className = 'error';
      result.textContent = 'Could not reach the server.';
    }
    submit.disabled = false;
  });
</script>
</body>
</html>
